<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · XV María Isabella</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0a0707;color:#fbeecb;font-family:"Playfair Display",Georgia,serif;padding:1.5rem 1rem}
.caja{max-width:460px;margin:0 auto;padding:1.6rem 1.3rem;border:1px solid rgba(212,175,55,.6);border-radius:10px;background:#140c0c}
h1{font-family:"Cinzel",serif;color:#f5d678;font-size:1.15rem;letter-spacing:.15em;text-align:center;margin:0 0 1.2rem}
label{display:block;font-family:"Cinzel",serif;font-size:.68rem;letter-spacing:.2em;color:#d4af37;margin:1rem 0 .4rem}
input{width:100%;padding:.8rem;font:inherit;font-size:1rem;color:#fbeecb;background:#000;border:1px solid rgba(212,175,55,.55);border-radius:8px}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.nums button{padding:.7rem 0;font:600 1.05rem "Cinzel",serif;color:#fbeecb;background:#000;border:1px solid rgba(212,175,55,.55);border-radius:8px;cursor:pointer}
.nums button.on{background:linear-gradient(135deg,#6e0c12,#c81d26);border-color:#f5d678}
#enlace{margin-top:1.2rem;padding:.8rem;border-radius:8px;background:#000;font-size:.85rem;word-break:break-all;color:#f5d678;min-height:2.6rem}
.acciones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.8rem}
.acciones a,.acciones button{padding:.8rem .3rem;text-align:center;text-decoration:none;font:700 .72rem "Cinzel",serif;letter-spacing:.08em;color:#2a0a05;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(135deg,#b88a2c,#f7e08a 40%,#d4af37 60%,#fff1b8)}
small{display:block;margin-top:1rem;color:#bfae88;font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="caja">
  <h1>ENLACES DE INVITADOS</h1>
  <label for="nom">NOMBRE DEL INVITADO (opcional)</label>
  <input id="nom" placeholder="Ej.: Familia Pérez">
  <label>PUESTOS RESERVADOS</label>
  <div class="nums" id="nums"></div>
  <label for="otro">OTRA CANTIDAD</label>
  <input id="otro" type="number" min="1" max="50" inputmode="numeric" placeholder="Ej.: 8">
  <div id="enlace"></div>
  <div class="acciones">
    <button id="copiar">COPIAR</button>
    <a id="whats" target="_blank" rel="noopener">WHATSAPP</a>
    <a id="ver" target="_blank" rel="noopener">VER</a>
  </div>
  <small>Cada enlace muestra el nombre y los puestos en el “Pase VIP”.</small>
</div>
<script>
const base = location.href.replace(/panel\.html.*$/,"").split("?")[0].split("#")[0];
let p = 2;
const nums = document.getElementById("nums");
for(let i=1;i<=6;i++){ const b=document.createElement("button"); b.textContent=i; b.onclick=()=>{p=i;document.getElementById("otro").value="";pinta();}; nums.appendChild(b); }
function enlace(){
  const n=document.getElementById("nom").value.trim();
  const ps=new URLSearchParams(); if(n) ps.set("n",n); ps.set("p",p);
  return base+"?"+ps.toString();
}
function pinta(){
  [...nums.children].forEach((b,i)=>b.classList.toggle("on",i+1===p));
  const url=enlace(), n=document.getElementById("nom").value.trim();
  document.getElementById("enlace").textContent=url;
  document.getElementById("ver").href=url;
  const msg=(n?"Hola "+n+", ":"¡Hola! ")+"con mucho cariño te invitamos a los XV de María Isabella 🎬✨ Aquí está tu pase: "+url;
  document.getElementById("whats").href="https://wa.me/?text="+encodeURIComponent(msg);
}
document.getElementById("nom").oninput=pinta;
document.getElementById("otro").oninput=e=>{const v=parseInt(e.target.value,10); if(v>0){p=v;pinta();}};
document.getElementById("copiar").onclick=async e=>{
  try{ await navigator.clipboard.writeText(enlace()); e.target.textContent="¡COPIADO!"; setTimeout(()=>e.target.textContent="COPIAR",1500);}catch(_){}
};
pinta();
</script>
</body>
</html>
